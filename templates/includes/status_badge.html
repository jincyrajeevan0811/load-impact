{% if status == 'active' or status == 'paid' or status == 'attended' %}<span class="badge rounded-pill text-bg-success">{{ label }}</span>{% elif status == 'pending' or status == 'booked' %}<span class="badge rounded-pill {% if status == 'booked' %}text-bg-primary{% else %}text-bg-warning{% endif %}">{{ label }}</span>{% elif status == 'expired' or status == 'missed' or status == 'refunded' %}<span class="badge rounded-pill text-bg-secondary">{{ label }}</span>{% else %}<span class="badge rounded-pill text-bg-danger">{{ label }}</span>{% endif %}
