<section class="section">
  <div class="container">
    <div class="row g-5 align-items-center">
      <div class="col-lg-6" data-reveal="left">
        <div class="about-collage">
          <div class="ph ph-1" style="--img1: url('{{ s.img }}')"></div>
          <div class="ph ph-2" style="--img2: url('{{ s.img2 }}')"></div>
          {% if s.badge_display %}<div class="exp-badge"><div class="num count-up">{{ s.badge_display }}</div><div class="small fw-semibold" style="max-width:130px">{{ s.badge_text }}</div></div>{% endif %}
        </div>
      </div>
      <div class="col-lg-6" data-reveal="right">
        {% include 'appearance/_heading.html' %}
        {% if s.subtitle %}<div class="text-muted">{{ s.subtitle|linebreaks }}</div>{% endif %}
        {% if s.item_list %}
        <div class="row g-3 mt-2">
          {% for item in s.item_list %}
          <div class="col-sm-6"><div class="card-li p-3 h-100 d-flex gap-3"><span class="feature-icon flex-shrink-0" style="width:48px;height:48px;font-size:1.2rem"><i class="bi {{ item.icon|default:'bi-check2' }}"></i></span><div><strong class="text-white">{{ item.title }}</strong><div class="small text-muted">{{ item.text }}</div></div></div></div>
          {% endfor %}
        </div>
        {% endif %}
      </div>
    </div>
  </div>
</section>
