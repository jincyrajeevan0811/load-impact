<section class="section pb-0">
  <div class="container">
    <div class="row g-4">
      <div class="col-sm-6 col-lg-3" data-reveal="up"><div class="card-li p-4 h-100 text-center"><div class="feature-icon mb-3"><i class="bi bi-geo-alt"></i></div><h5 class="text-white">Visit us</h5><p class="small text-muted mb-0">{{ GYM.address }}</p></div></div>
      <div class="col-sm-6 col-lg-3" data-reveal="up" data-delay=".1"><div class="card-li p-4 h-100 text-center"><div class="feature-icon mb-3"><i class="bi bi-telephone"></i></div><h5 class="text-white">Call us</h5><a href="tel:{{ GYM.phone|cut:' ' }}" class="small">{{ GYM.phone }}</a></div></div>
      <div class="col-sm-6 col-lg-3" data-reveal="up" data-delay=".2"><div class="card-li p-4 h-100 text-center"><div class="feature-icon mb-3"><i class="bi bi-envelope"></i></div><h5 class="text-white">Email us</h5><a href="mailto:{{ GYM.email }}" class="small">{{ GYM.email }}</a></div></div>
      <div class="col-sm-6 col-lg-3" data-reveal="up" data-delay=".3"><div class="card-li p-4 h-100 text-center"><div class="feature-icon mb-3"><i class="bi bi-clock"></i></div><h5 class="text-white">Hours</h5><p class="small text-muted mb-0">Mon–Sat {{ GYM.hours_weekday }}<br>Sun {{ GYM.hours_weekend }}</p></div></div>
    </div>
  </div>
</section>
