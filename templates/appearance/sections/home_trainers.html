{% if trainers %}
<section class="section">
  <div class="container">
    <div class="row align-items-end mb-5 g-3">
      <div class="col-lg-8" data-reveal="left">{% include 'appearance/_heading.html' with lead=True %}</div>
      {% if s.button_text %}<div class="col-lg-4 text-lg-end" data-reveal="right"><a href="{{ s.button_url|default:'/trainers/' }}" class="btn btn-glass">{{ s.button_text }} <i class="bi bi-arrow-right ms-1"></i></a></div>{% endif %}
    </div>
    <div class="row g-4">
      {% for trainer in trainers %}{% include 'gym/_trainer_card.html' %}{% endfor %}
    </div>
  </div>
</section>
{% endif %}
