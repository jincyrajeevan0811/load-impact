{% extends 'dashboard/base.html' %}
{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}
{% block content %}
<div class="panel" style="max-width: 600px;">
  <div class="text-center py-3">
    <i class="bi bi-exclamation-triangle text-danger" style="font-size:3rem"></i>
    <h4 class="mt-3">Delete "{{ object }}"?</h4>
    <p class="text-muted">{{ warning|default:"This action cannot be undone." }}</p>
    <form method="post" class="d-flex justify-content-center gap-2 mt-4">
      {% csrf_token %}
      <a href="{{ back_url }}" class="btn btn-outline-secondary">Cancel</a>
      <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Yes, delete</button>
    </form>
  </div>
</div>
{% endblock %}
